[package]
name = "vertox"
version = "0.2.0"
edition = "2021"
description = "Robinhood Chain smart-contract security analysis and EVM reverse-engineering toolkit"
readme = "README.md"
license = "SSPL-1.0"
keywords = ["robinhood-chain", "evm", "security", "solidity", "reverse-engineering"]
categories = ["command-line-utilities", "development-tools"]
publish = false
repository = "https://github.com/AndrewKCollins/vertox"
homepage = "https://github.com/AndrewKCollins/vertox"

[[bin]]
name = "vertox"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
include_dir = "0.7"
regex = "1.11"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-keccak = { version = "2.0", features = ["keccak"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"
